[project]
name = "typescript-skill"
version = "0.0.0"
description = "A TypeScript skill catalogue for coding agents"
requires-python = ">=3.14"
dependencies = []

# The manifest contract tools are pinned here rather than installed ad hoc, so
# `make lint` validates every skill with the same parser and linter everywhere.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref",
    "yamllint",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tests"]

# PyYAML ships no py.typed marker as of 6.0.3.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.ruff]
# The vendored uv helper is copied byte for byte from shared-actions and is
# never edited in place, so it is outside the local style rules.
extend-exclude = ["scripts/uv_gate.py"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
